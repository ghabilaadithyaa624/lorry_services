name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/lorrycarry"
  DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/lorrycarry"

jobs:
  test_and_build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/db"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/lorrycarry?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/lorrycarry?schema=public"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install specified npm version
        run: npm install -g npm@11.12.1

      - name: Install Dependencies
        run: npm install --no-audit --no-fund
        run: npm install --legacy-peer-deps

      - name: Validate Prisma Schema
        run: npx prisma validate --schema=packages/database/prisma/schema.prisma

      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Build Shared Package
        run: npm run build --workspace=@lorrycarry/shared

      - name: Run Shared Package Tests
        run: npm run test --workspace=@lorrycarry/shared

      - name: Lint Code
        run: npm run lint

      - name: Run API Tests
        run: npm --prefix apps/api test

      - name: Run Web Tests
        run: npm --prefix apps/web test

      - name: Build Database Package
        run: npm run build --workspace=@lorrycarry/database

      - name: Run API Tests
        run: npm --prefix apps/api test

      - name: Run Web Tests
        run: npm --prefix apps/web test

      - name: Run Tests
        run: npm --prefix apps/api test

      - name: Build API
        run: npm run build --workspace=@lorrycarry/api

      - name: Build Web
        run: npm run build --workspace=@lorrycarry/web
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Build Admin
        run: npm run build --workspace=@lorrycarry/admin

  deploy_staging:
    name: Deploy to Staging
    needs: test_and_build
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build API Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: lorrycarry-api:staging

      - name: Build Web Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: lorrycarry-web:staging

      - name: Build Admin Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: apps/admin/Dockerfile
          push: false
          tags: lorrycarry-admin:staging

      - name: Simulate Staging Deployment
        run: echo "Images built successfully. Ready for registry push and deployment to staging infrastructure."
