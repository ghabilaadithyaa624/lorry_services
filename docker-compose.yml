services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: lorrycarry-svc-db
    environment:
      POSTGRES_USER: lorrycarry
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: lorrycarry_dev
    ports:
      - "5438:5432"
    volumes:
      - postgres_svc_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lorrycarry"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lorrycarry-svc-redis
    ports:
      - "6388:6379"

  minio:
    image: minio/minio:latest
    container_name: lorrycarry-svc-s3
    command: server /data --console-address ":9009"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9008:9000"
      - "9009:9001"
    volumes:
      - minio_svc_data:/data

volumes:
  postgres_svc_data:
  minio_svc_data: