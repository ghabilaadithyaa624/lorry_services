services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: lorrycarry-svc-db
    environment:
      POSTGRES_USER: lorrycarry
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: lorrycarry_dev
    ports:
      - "5438:5432"
    volumes:
      - postgres_svc_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lorrycarry"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lorrycarry-svc-redis
    ports:
      - "6388:6379"

  minio:
    image: minio/minio:latest
    container_name: lorrycarry-svc-s3
    command: server /data --console-address ":9009"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9008:9000"
      - "9009:9001"
    volumes:
      - minio_svc_data:/data

  migration:
    image: node:20-alpine
    container_name: lorrycarry-migration
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: "postgresql://lorrycarry:localdev@postgres:5432/lorrycarry_dev?schema=public"
    command: sh -c "npm i -g prisma && cd packages/database && npx prisma migrate deploy"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: lorrycarry-api
    ports:
      - "3002:3002"
    env_file:
      - .env.staging.example
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migration:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: lorrycarry-web
    ports:
      - "3000:3000"
    env_file:
      - .env.staging.example
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: lorrycarry-admin
    ports:
      - "3001:80"
    env_file:
      - .env.staging.example
    depends_on:
      - api

volumes:
  postgres_svc_data:
  minio_svc_data: